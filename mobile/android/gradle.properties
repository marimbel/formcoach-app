org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.50 template flags for Android Gradle Plugin 9 (keep until Flutter finishes its AGP 9 migration)
android.newDsl=false
android.builtInKotlin=false
# Some plugins (e.g. tflite_flutter) compile Java for 11 and Kotlin for the JDK's version; with Kotlin 2.4 that
# mismatch stops the build. Report it as a warning instead (Android's D8 accepts both).
kotlin.jvm.target.validation.mode=warning
